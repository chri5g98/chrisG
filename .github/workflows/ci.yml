name: Build, test and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publishes the app to GitHub Pages from master or the FMAREA rebuild branch.
  # Turn it on once in the repository: Settings → Pages → Source: GitHub Actions.
  deploy:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/fmarea-app-rebuild-1ep5wh') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
